[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "et-reference"
version = "0.1.0"
description = "ERA5-Land asosida ASCE standartlashtirilgan ETo/ETr oylik rasterlari"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "tzdata",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "pyproj>=3.4",
    "scipy>=1.10",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.28",
    "cdsapi>=0.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "refet>=0.4"]

[project.scripts]
et-reference = "et_reference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
